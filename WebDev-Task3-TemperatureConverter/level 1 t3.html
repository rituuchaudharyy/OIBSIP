<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="level 1 t3.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🌡️ Temperature Converter</h1>
            <p>Convert between Celsius, Fahrenheit and Kelvin</p>
        </div>

        <div class="converter-box">

            <h2>Enter Temperature</h2>

            <div class="input-section">

                <div class="field">
                    <label for="temperature">Temperature Value</label>
                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature"
                        step="any"
                    >
                    <p id="error"></p>
                </div>

                <div class="field">
                    <label for="unit">Input Unit</label>

                    <select id="unit">
                        <option value="C">Celsius (°C)</option>
                        <option value="F">Fahrenheit (°F)</option>
                        <option value="K">Kelvin (K)</option>
                    </select>
                </div>

            </div>

            <button id="convertBtn">🔄 Convert</button>

            <h2 class="result-heading">Converted Results</h2>

            <div class="results">

                <div class="result">
                    <span>❄️ Celsius</span>
                    <strong id="celsius">-- °C</strong>
                </div>

                <div class="result">
                    <span>🔥 Fahrenheit</span>
                    <strong id="fahrenheit">-- °F</strong>
                </div>

                <div class="result">
                    <span>🧪 Kelvin</span>
                    <strong id="kelvin">-- K</strong>
                </div>

            </div>

            <div class="note">
                ⚠️ The lowest possible temperature is
                <b>-273.15°C (0 K)</b>.
            </div>

        </div>

        <footer>
            🌡️ Stay curious, stay warm (or cool)! 😊
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
